[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antonino-tuttofare"
version = "0.1.0"
description = "Standalone Raspberry Pi 3B+ project with a plugin-based architecture"
requires-python = ">=3.11"
dependencies = [
    # Linux only: reads /dev/input/event* devices (keyboards, joysticks).
    "evdev>=1.7; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "hal*", "ui*", "plugins*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear, UP: modern syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true