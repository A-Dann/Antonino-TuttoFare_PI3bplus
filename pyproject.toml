[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "progetto_raspberry"
version = "0.1.0"
dependencies = [
    "psutil",
    "requests"
]

# Aggiungi questo blocco per indicare che il pacchetto vive dentro 'src'
[tool.setuptools.packages.find]
where = ["src"]